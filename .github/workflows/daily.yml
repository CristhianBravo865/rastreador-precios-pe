name: Revisión diaria (tiendas en Actions)

# Revisa las tiendas con `runner: actions` en config/stores.yaml y hace commit
# de los datos en main. Falabella se revisa desde una PC (ADR-000).

on:
  schedule:
    # 06:17 en Lima (UTC-5). Un minuto no redondo evita la congestión de GitHub a las :00.
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Instalar dependencias
        run: uv sync --frozen
      - name: Revisar precios
        run: uv run rastreador run --runner actions
      - name: Guardar datos en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin datos nuevos."
            exit 0
          fi
          git commit -q -m "datos: revisión diaria $(date -u +%F) (actions)"
          # La PC local puede haber hecho push mientras tanto: cada tienda escribe
          # en su propio archivo, así que el rebase no tiene conflictos.
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep $((i * 10))
          done
          exit 1
